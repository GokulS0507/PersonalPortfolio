<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Gokul S for software development opportunities and collaboration.">

    <title>Contact | Gokul S</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Get In Touch</h2>

            <p>
                Interested in collaborating or discussing
                software development opportunities?
                Feel free to contact me.
            </p>

            <form action="mailto:your-email@example.com"
                  method="post"
                  enctype="text/plain">

                <div class="form-group">
                    <label for="name">Your Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter subject"
                        required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message"
                        required></textarea>
                </div>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Gokul S. All Rights Reserved.</p>
    </footer>

</body>
</html>
